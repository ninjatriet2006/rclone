[package]
name = "rclonetuiv2"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
lazy_static = "1.4"
which = "4.4"
libc = "0.2"
webbrowser = "0.8"
serde_yaml = "0.9"
regex = "1"
unicode-width = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }

